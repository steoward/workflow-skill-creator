[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workflow-skill-creator"
version = "2.0.0"
description = "Distills completed agent interactions and workflows into reusable, production-grade agent skills."
readme = "README.md"
authors = [
    { name = "steoward" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
workflow-distill = "scripts.distill:main"
workflow-validate = "scripts.validator:main"
workflow-scaffold = "scripts.scaffold:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
